# serves: F-056 — Express any context in BigContext Schema
id: https://w3id.org/bigcontext-schema  # permanent identifier to be registered before publishing
name: bigcontext_schema
title: BigContext Schema (draft)
version: 0.9.3-draft
description: >-
  A small, closed set of building blocks for expressing business context taken from natural language:
  simple rules, long procedures, company structure, data and mappings. Tier 1 is the element types, tier 2 the
  statement types (predicates) whose roles come from one shared dictionary of slots, tier 3 the qualifiers
  every statement can carry. Kinds of a particular product (such as BigContext's 52) live in that product's
  profile, not here. Shared groups of fields any statement can carry (decision, assignment, snapshot, data
  profile) cover kinds of context that recur across many statement types. A computable core (key pairs, filters,
  aggregations, metric types, time grains) lets metric and join definitions move to and from semantic-layer
  formats.
prefixes:
  linkml: https://w3id.org/linkml/
  bcs: https://w3id.org/bigcontext-schema/
  # the W3C vocabularies BigContext Schema's building blocks correspond to (see the README's alignment table)
  odrl: http://www.w3.org/ns/odrl/2/
  org: http://www.w3.org/ns/org#
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#
  dcat: http://www.w3.org/ns/dcat#
  dqv: http://www.w3.org/ns/dqv#
  oa: http://www.w3.org/ns/oa#
  dcterms: http://purl.org/dc/terms/
default_prefix: bcs
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------- tier 1: elements and shared structures
classes:
  ContextDocument:
    tree_root: true
    description: Everything expressed from one source document, or one section of it.
    slots: [source, external, linked_sources, revisions, things, concepts, statements, procedures, conflicts, unmapped,
      skipped]

  Source:
    slots: [id, title, version, date, as_of, location]

  LinkedSource:
    description: Another source whose elements this document refers to as prefix:id.
    attributes:
      prefix:
        required: true
        pattern: "^[a-z][a-z0-9_]*$"
        description: The short name used before the colon (metrics in metrics:c.active_customer).
      base_iri:
        required: true
        pattern: "^https?://.*[/#]$"
        description: The other source's base IRI, ending in / or #.
      title: {}

  Evidence:
    close_mappings: ["oa:TextQuoteSelector"]
    description: An exact quote from the source that the element or statement came from.
    attributes:
      quote:
        required: true
        exact_mappings: ["oa:exact"]
        description: Copied exactly from the source text.

  Element:
    abstract: true
    slots: [id, label, evidence, note]

  Thing:
    is_a: Element
    description: A named individual the context talks about (a person, a team, a post, a table, a system).
    slots: [thing_type, aliases, physical_name]
    slot_usage:
      label: {required: true}
      thing_type: {required: true}

  Concept:
    is_a: Element
    description: A business word or category the context talks about (customer, revenue, approved refund).
    slots: [concept_type, aliases]
    slot_usage:
      label: {required: true}
      concept_type: {required: true}

  Value:
    description: A literal value, kept with its type, unit and the part it plays.
    attributes:
      value: {required: true}
      datatype: {range: DatatypeEnum}
      unit: {}
      role:
        range: ValueRoleEnum
        description: The part this value plays (a weight, a threshold, a resulting score, a minimum).
      comparator:
        range: ComparatorEnum
        description: For thresholds, how the value is compared (more than, at most).
      applies_to:
        range: Element
        description: The element this value belongs to, when a statement has several (the input a weight is for).

  Condition:
    close_mappings: ["odrl:Constraint"]
    description: >-
      When something holds. The description is a short phrase; about names the elements it mentions. A condition
      that is a data filter also gives field, comparator and values, so it can be run.
    attributes:
      description: {required: true}
      about: {range: Element, multivalued: true}
      field: {range: Element, description: "The column the filter tests."}
      comparator: {range: FilterComparatorEnum}
      values: {range: Value, multivalued: true, inlined_as_list: true}

  Case:
    description: One row of a step-wise calculation (when this holds, the result is that value).
    attributes:
      when: {range: Condition, required: true, inlined: true}
      value: {range: Value, required: true, inlined: true}

  KeyPair:
    description: One pair of columns a join matches on.
    attributes:
      from_field: {range: Element, required: true}
      to_field: {range: Element, required: true}

  Action:
    close_mappings: ["odrl:Action"]
    description: What is done, with a closed verb class, the text's own verb and the elements involved.
    attributes:
      verb: {range: VerbEnum, required: true}
      specific_verb:
        description: >-
          The verb as the text uses it, in lower case, when it is more specific than the closed class
          (page, recommend, deduplicate, invite). It is the organization's vocabulary, not a closed list.
      objects: {range: Element, multivalued: true}
      values: {range: Value, multivalued: true, inlined_as_list: true}
      via:
        range: Element
        multivalued: true
        description: The channel, tool or intermediary the action goes through (PagerDuty, Slack, the account manager).
      to:
        range: Element
        multivalued: true
        description: Who receives the action or where its result goes.
      by:
        range: Element
        multivalued: true
        description: >-
          The dimensions an analysis is broken down by ("spend by channel"). Never who does the action: a rule's
          party goes in binds, a step's in performer.
      options_in_order:
        range: Element
        multivalued: true
        description: Alternatives in order of preference, first preferred.
      detail:
        description: Only what the rest cannot carry (a short phrase).
      when:
        range: Condition
        multivalued: true
        inlined_as_list: true
        description: Conditions for this action, used when an action is one of several alternatives.
      alternatives:
        range: Action
        multivalued: true
        inlined_as_list: true
        description: Actions any one of which satisfies this one ("either a or b"); each may carry its own when.
      then:
        range: Action
        multivalued: true
        inlined_as_list: true
        description: Actions that follow this one within the same instruction ("stop and ask").

  # ---------------------------------------------------------------- tier 2: statement types
  Statement:
    is_a: Element
    abstract: true
    description: One claim. Its type is the predicate; its roles come from the shared slot dictionary.
    slots: [predicate, when, when_any, unless, even_if, because, so_that, scope, frequency, certainty, importance,
            negated, currently, valid_from, valid_to, valid_while, as_of, within, via, exclusive, stated_by,
            held_by, proposed_by, decided_by, decided_on, decided_in, ratified_by, endorsed_by, disputed_by,
            informed, decision_status, supersedes, ratified_on, ratified_in, progress, due_by, recurrence,
            answers, each, or_more_senior, automatic,
            capacity, acting_for, line, share, cadence]
    slot_usage:
      evidence: {required: true}

  # meaning
  Definition:
    close_mappings: ["skos:definition"]
    is_a: Statement
    description: What a term or a named thing is, in words.
    slots: [subject, text, object]
    slot_usage:
      subject: {required: true, description: "The term or thing being defined or described."}
      text: {required: true, description: "The meaning, as the source gives it."}
      object: {description: "The broader category it belongs to, if the source names one."}
  IsA:
    close_mappings: ["skos:broader"]
    is_a: Statement
    description: Something is an instance or subtype of a category.
    slots: [subject, object]
    slot_usage:
      subject: {required: true}
      object: {required: true, description: "The category."}
  SynonymOf:
    close_mappings: ["skos:altLabel"]
    is_a: Statement
    description: A word or abbreviation that refers to an element.
    slots: [term, subject, usage]
    slot_usage:
      term: {required: true, description: "The other word exactly as used."}
      subject: {required: true, description: "What the word refers to."}
  Groups:
    is_a: Statement
    description: A named group made of members.
    slots: [subject, members, complete]
    slot_usage:
      subject: {required: true, description: "The group."}
      members: {required: true}
  HasValues:
    is_a: Statement
    description: The values a field or dimension can take, as literals or as concepts (at least one of the two).
    slots: [subject, values, members, complete]
    slot_usage:
      subject: {required: true, description: "The field or dimension."}
      members: {description: "Values that are concepts elsewhere in the context."}
  ComputedAs:
    is_a: Statement
    description: How a measure, score or derived field is calculated.
    slots: [subject, expression, inputs, values, cases, metric_type, aggregation, base, time_dimension, numerator,
            denominator, filters, dialect]
    slot_usage:
      subject: {required: true, description: "What is calculated."}
      expression: {required: true, description: "The calculation in the source's notation or plain words."}
  Sequence:
    is_a: Statement
    description: Items in a meaningful order (a funnel, hierarchy levels, a derivation chain, a response format).
    slots: [subject, items, sequence_type, complete]
    slot_usage:
      items: {required: true}
      sequence_type: {required: true}
  HasProperty:
    is_a: Statement
    description: >-
      An element has a literal value for an attribute that no other statement type covers. Use the data statement
      types for grain, coverage and status.
    slots: [subject, attribute, standard_attribute, value]
    slot_usage:
      subject: {required: true}
      attribute: {description: "A concept naming the attribute, when no standard attribute fits."}
      standard_attribute: {description: "The attribute from the fixed vocabulary (give this or attribute)."}
      value: {required: true}
  UsedFor:
    is_a: Statement
    description: What an element is for (or, negated, not for).
    slots: [subject, text, object]
    slot_usage:
      subject: {required: true}
      text: {required: true, description: "The purpose, in words."}
      object: {description: "The activity or question type it serves, if it is an element."}

  # rules
  Rule:
    close_mappings: ["odrl:Rule"]
    is_a: Statement
    description: A norm. When the conditions hold, the action must, must not, should, may or by default is done.
    slots: [modality, action, overrides, binds, absolute]
    slot_usage:
      modality: {required: true}
      action: {required: true}
  RuleSet:
    close_mappings: ["odrl:Policy"]
    is_a: Statement
    description: A named group of rules that share a scope, a strength or a precedence ("these rules override team guidelines").
    slots: [subject, members, overrides, absolute]
    slot_usage:
      members: {required: true, description: "The ids of the rules in the set."}
      subject: {description: "A concept naming the set, if the source names it."}

  # company structure
  PartOf:
    close_mappings: ["dcterms:isPartOf"]
    related_mappings: ["org:unitOf"]
    is_a: Statement
    description: A part belongs to a whole (a team in a department, a market in a region). Transitive.
    slots: [subject, object, cardinality, complete]
    slot_usage:
      subject: {required: true, description: "The part."}
      object: {required: true, description: "The whole."}
      complete: {description: "True when the source says these are all the parts of the whole."}
  MemberOf:
    exact_mappings: ["org:memberOf"]
    is_a: Statement
    description: A person, agent or team is a member of a unit, optionally in a role.
    slots: [subject, object, role]
    slot_usage:
      subject: {required: true}
      object: {required: true, description: "The unit."}
  HoldsRole:
    close_mappings: ["org:holds"]
    is_a: Statement
    description: A person, agent or post holds a role (the role may be a post or a kind of role).
    slots: [subject, object]
    slot_usage:
      subject: {required: true}
      object: {required: true, description: "The role or post."}
  ReportsTo:
    exact_mappings: ["org:reportsTo"]
    is_a: Statement
    description: A person, post or unit reports to another. Transitive.
    slots: [subject, object, direct]
    slot_usage:
      subject: {required: true, description: "Who reports."}
      object: {required: true, description: "Who is reported to."}
  Heads:
    exact_mappings: ["org:headOf"]
    is_a: Statement
    description: A person or post heads a unit, team or organization (a structure link, like reporting).
    slots: [subject, object]
    slot_usage:
      subject: {required: true, description: "The person or post at the head."}
      object: {required: true, description: "The unit, team or organization."}
  ResponsibleFor:
    is_a: Statement
    description: A party has a responsibility for something, possibly answering to someone for it.
    slots: [subject, object, responsibility, text, answers_to]
    slot_usage:
      subject: {required: true, description: "The person, post, team or unit."}
      responsibility: {required: true}
      text: {description: "The responsibility in words when no element names it."}
  HasAccess:
    close_mappings: ["odrl:Permission"]
    is_a: Statement
    description: A party can or cannot use a resource.
    slots: [subject, object, access]
    slot_usage:
      subject: {required: true}
      object: {required: true}
      access: {required: true}
  Appoints:
    is_a: Statement
    description: A party appoints or designates the holder of a post, possibly with another party's consent.
    slots: [subject, object, with_consent_of]
    slot_usage:
      subject: {required: true, description: "Who appoints."}
      object: {required: true, description: "The post or person appointed."}
  EscalatesTo:
    is_a: Statement
    description: A party escalates to another (an escalation path, not a reporting line), usually under conditions.
    slots: [subject, object]
    slot_usage:
      subject: {required: true}
      object: {required: true}
  WorksWith:
    is_a: Statement
    description: Two parties work together, coordinate or keep liaison, optionally on a topic.
    slots: [subject, object, text]
    slot_usage:
      subject: {required: true}
      object: {required: true}
      text: {description: "What they work together on."}
  Represents:
    is_a: Statement
    description: A party acts on behalf of another, optionally towards an audience.
    slots: [subject, object, audience]
    slot_usage:
      subject: {required: true, description: "Who represents."}
      object: {required: true, description: "Who is represented."}
  Serves:
    is_a: Statement
    description: A unit serves or covers places, populations or other units (a region's states, a team's customers).
    slots: [subject, members, complete]
    slot_usage:
      subject: {required: true}
      members: {required: true, description: "What it serves."}
  GovernedBy:
    related_mappings: ["dcterms:conformsTo"]
    is_a: Statement
    description: Something is established, governed or constrained by a law, policy, agreement or document.
    slots: [subject, object, text]
    slot_usage:
      subject: {required: true}
      object: {required: true, description: "The law, policy, agreement or document."}

  # lifecycles and automatic behaviour
  Transition:
    is_a: Statement
    description: Something moves from one state to another, when something happens (one edge of a lifecycle).
    slots: [subject, from_state, to_state, alternative_states, performer]
    slot_usage:
      subject: {required: true, description: "What changes state (an incident, an order)."}
      to_state: {required: true}
      alternative_states: {description: "Other states it may end in instead ('deleted, aggregated or de-identified')."}
  Triggers:
    is_a: Statement
    description: When something happens, a system or party does something automatically (not a norm, a behaviour).
    slots: [subject, action]
    slot_usage:
      subject: {required: true, description: "The system or party that acts."}
      action: {required: true}

  # mapping
  Mapping:
    close_mappings: ["skos:mappingRelation"]
    is_a: Statement
    description: Two elements correspond, with how close the match is and why.
    slots: [subject, object, match, justification]
    slot_usage:
      subject: {required: true}
      object: {required: true}
      match: {required: true}
  ImplementedBy:
    is_a: Statement
    description: A business concept is represented in data by a field, table or filter.
    slots: [subject, object, expression, primary]
    slot_usage:
      subject: {required: true, description: "The concept."}
      object: {required: true, description: "The field, table or other data element."}
      expression: {description: "The filter or expression, if any."}
  JoinsTo:
    is_a: Statement
    description: How two data elements join.
    slots: [subject, object, keys, key_pairs, cardinality, dedup, join_type]
    slot_usage:
      subject: {required: true}
      object: {required: true}

  # data assets
  Contains:
    is_a: Statement
    description: A table or dataset holds information about something, in a given role (a measure, a dimension, a key).
    slots: [subject, object, data_role, time_grain]
    slot_usage:
      subject: {required: true, description: "The table or dataset."}
      object: {required: true, description: "The field, concept or entity it holds information about."}
  HasGrain:
    is_a: Statement
    description: What one row of a table stands for ("one row per order line").
    slots: [subject, members, text]
    slot_usage:
      subject: {required: true}
      text: {required: true, description: "The grain as the source gives it."}
      members: {description: "The elements that together make up one row, when named."}
  Covers:
    close_mappings: ["dcterms:coverage"]
    is_a: Statement
    description: >-
      Which rows a table or dataset covers: which platforms, populations, places or periods (use valid_from and
      valid_to for the period).
    slots: [subject, members, complete, primary]
    slot_usage:
      subject: {required: true}
      complete: {description: "True when the source says it covers only these."}
      primary: {description: "True when it is the source of truth for these."}
  HasStatus:
    is_a: Statement
    description: The lifecycle status of an element (active, deprecated, retired, planned, experimental).
    slots: [subject, status]
    slot_usage:
      subject: {required: true}
      status: {required: true}
  DerivedFrom:
    exact_mappings: ["prov:wasDerivedFrom"]
    is_a: Statement
    description: An element is built or sourced from another (an aggregate built on a mart; a table built from a vendor's export).
    slots: [subject, object, text]
    slot_usage:
      subject: {required: true}
      object: {required: true, description: "What it is built or sourced from."}
      text: {description: "How, if the source says."}
  IdentifiedBy:
    is_a: Statement
    description: The elements that together identify each instance of the subject (a table's unique key).
    slots: [subject, members]
    slot_usage:
      subject: {required: true}
      members: {required: true, description: "The fields or elements that together identify it."}
  Has:
    is_a: Statement
    description: Each subject has some number of the object (a boat has one owner; a user has many sessions).
    slots: [subject, object, cardinality, role]
    slot_usage:
      subject: {required: true}
      object: {required: true}
      cardinality: {description: "How many of the object each subject has."}
      role: {description: "The role the object plays, if named (captain)."}
  Caveat:
    close_mappings: ["dqv:QualityAnnotation"]
    is_a: Statement
    description: A known limitation or quality problem that a reader of the subject must allow for.
    slots: [subject, text, object]
    slot_usage:
      subject: {required: true}
      text: {required: true, description: "The limitation, as the source gives it."}
      object: {description: "A second element the limitation is about (the table it will not tie to)."}

  # belief
  Indicates:
    is_a: Statement
    description: When a pattern is seen (the when conditions), it suggests a conclusion.
    slots: [subject, text, values]
    slot_usage:
      text: {required: true, description: "The conclusion."}
  Influences:
    is_a: Statement
    description: One element affects another.
    slots: [subject, object, direction, text]
    slot_usage:
      subject: {required: true, description: "The cause."}
      object: {required: true, description: "The effect."}

  # patterns, gaps and examples
  Template:
    is_a: Statement
    description: >-
      A reusable pattern for a kind of task (a sample query, a message or report format), linked to the use case it
      serves, with the elements it uses and the placeholders to fill. One-off values in a sample are values with
      role example; placeholders are values with role parameter.
    slots: [subject, text, inputs, values, outputs]
    slot_usage:
      subject: {required: true, description: "The use case: an activity concept or procedure the pattern is for."}
      text: {required: true, description: "The pattern as given (the SQL, the message outline)."}
      inputs: {description: "The tables, fields, metrics and joins it uses."}
      outputs: {description: "What it produces (columns, sections), when named."}
  Gap:
    is_a: Statement
    description: Something the source says is missing, unknown or future work.
    slots: [subject, text]
    slot_usage:
      text: {required: true}
  Example:
    close_mappings: ["skos:example"]
    is_a: Statement
    description: An example the source gives, attached to what it illustrates.
    slots: [subject, text]
    slot_usage:
      subject: {required: true, description: "What it illustrates (an element, statement or procedure)."}
      text: {required: true, description: "The example, as given."}
  CreatedBy:
    close_mappings: ["dcterms:creator", "prov:wasAttributedTo"]
    is_a: Statement
    description: >-
      Who created, founded or wrote something (a project, a document, a team). Several creators go in members;
      unnamed ones ("numerous others") in text.
    slots: [subject, object, members, text]
    slot_usage:
      subject: {required: true, description: "What was created."}
      object: {description: "The creator, when there is one."}
  DescribedIn:
    is_a: Statement
    description: >-
      Where something is described in full: the text points to a document, page or section instead of saying it
      ("the process is described in PEP 8000"; "see the cherry-pick process").
    slots: [subject, object, text]
    slot_usage:
      subject: {required: true, description: "What is described."}
      object: {required: true, description: "The document, page or section that describes it."}

  # ---------------------------------------------------------------- procedures
  Procedure:
    is_a: Element
    description: An ordered set of steps, written as instructions or as a description of how work happens.
    slots: [mode, modality, goal, performer, trigger, scope, when, unless, because, so_that, inputs, outputs, steps]
    slot_usage:
      label: {required: true}
      mode: {required: true}
      steps: {required: true}
  Step:
    description: One step of a procedure.
    slots: [id, order, source_label, modality, action, performer, also_performed_by, or_more_senior, automatic, when,
            when_any, unless, even_if, because, so_that, within, due_by, recurrence, next, branches, calls, consumes,
            produces, evidence, note]
    slot_usage:
      order: {required: true}
      action: {required: true}
      evidence: {required: true}
  Branch:
    attributes:
      when: {range: Condition, required: true, inlined: true}
      go_to: {description: "The id of the step to go to."}
      outcome: {description: "Where the procedure ends up if it does not go to a step (stop, escalate, done)."}

  # ---------------------------------------------------------------- accounting
  Revision:
    description: One entry of the source's own change history.
    attributes:
      version: {}
      date: {}
      by: {range: Element, multivalued: true}
      summary: {required: true}
      evidence: {range: Evidence, multivalued: true, inlined_as_list: true, required: true}
  Conflict:
    description: Two or more statements that contradict each other, noticed while expressing the source.
    attributes:
      statements: {range: Element, multivalued: true, required: true}
      reason: {required: true}
  Unmapped:
    description: A statement BigContext Schema could not express. Kept, never dropped.
    attributes:
      evidence: {range: Evidence, multivalued: true, inlined_as_list: true, required: true}
      proposed_predicate: {required: true, description: "The statement type you would have needed."}
      reason: {required: true}
  Skipped:
    description: Source text that carries no context to express (a heading, formatting, navigation).
    attributes:
      evidence: {range: Evidence, multivalued: true, inlined_as_list: true, required: true}
      reason: {range: SkipReasonEnum, required: true}

# ---------------------------------------------------------------- the shared slot dictionary
slots:
  id: {identifier: true, required: true}
  label: {}
  note: {description: "A remark from whoever expressed the context; never part of its meaning."}
  title: {}
  version: {}
  date: {}
  location: {}
  aliases: {multivalued: true}
  evidence: {range: Evidence, multivalued: true, inlined_as_list: true}
  source: {range: Source, inlined: true, required: true}
  revisions: {range: Revision, multivalued: true, inlined_as_list: true}
  as_of: {description: "The date a snapshot was true, as an ISO date (2026-10, 2026-10-01); on the source, the date every undated statement holds as of.", pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$"}
  standard_attribute: {range: StandardAttributeEnum}
  within: {range: Value, inlined: true, description: "A time limit ('answer within 4 business hours')."}
  exclusive: {range: boolean, description: "True when the source says only these (only analysts, the only channel with carts)."}
  held_by: {range: Element, multivalued: true, description: "Whose preference, view or wish this is."}
  proposed_by: {range: Element, multivalued: true}
  decided_by: {range: Element, multivalued: true}
  decided_on: {}
  decided_in: {range: Element, description: "Where it was decided or recorded (a meeting, a channel, a ticket, a document)."}
  ratified_by: {range: Element, multivalued: true}
