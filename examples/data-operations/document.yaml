statements:
  # front matter
  - id: s.DO.1
    predicate: ResponsibleFor
    subject: t.data_platform_team
    responsibility: owns
    object: t.data_operations_playbook
    evidence: [{quote: "Owner: Data Platform team."}]
  - id: s.DO.2
    predicate: GovernedBy
    subject: c.data_product
    each: true
    object: t.data_operations_playbook
    scope: [t.enterprise_data_warehouse]
    evidence: [{quote: "Applies to every data product in the enterprise data warehouse."}]

  # 1. Definitions
  - id: s.DO.3
    predicate: Definition
    subject: c.data_product
    text: "a table, view, dashboard or report that the Data Platform team publishes for other teams to use"
    evidence: [{quote: "A data product is a table, view, dashboard or report that the Data Platform team publishes for other teams to use."}]
  - id: s.DO.97
    predicate: ResponsibleFor
    subject: t.data_platform_team
    responsibility: performs
    object: c.data_product
    text: "publishes data products for other teams to use"
    evidence: [{quote: "the Data Platform team publishes for other teams to use"}]
  - id: s.DO.4
    predicate: Has
    subject: c.data_product
    each: true
    object: c.data_product_owner
    cardinality: exactly_one
    evidence: [{quote: "Each data product has a named owner"}]
  - {id: s.DO.5, predicate: ResponsibleFor, subject: c.data_product_owner, responsibility: accountable, object: c.data_product_definition, evidence: [{quote: "who answers for its definition, its quality and its consumers."}]}
  - {id: s.DO.6, predicate: ResponsibleFor, subject: c.data_product_owner, responsibility: accountable, object: c.data_product_quality, evidence: [{quote: "who answers for its definition, its quality and its consumers."}]}
  - {id: s.DO.7, predicate: ResponsibleFor, subject: c.data_product_owner, responsibility: accountable, object: c.data_product_consumer, evidence: [{quote: "who answers for its definition, its quality and its consumers."}]}
  - id: s.DO.8
    predicate: Definition
    subject: c.data_incident
    text: "any event where a data product is late, incomplete or wrong, and a consumer could make a decision on it"
    evidence: [{quote: "A data incident is any event where a data product is late, incomplete or wrong, and a consumer could make a decision on it."}]
  - id: s.DO.9
    predicate: IsA
    subject: c.dashboard_past_freshness_deadline
    object: c.data_incident
    evidence: [{quote: "A dashboard that shows yesterday's numbers after its freshness deadline is a data incident."}]
  - id: s.DO.10
    predicate: IsA
    subject: c.failed_job_rerun_before_deadline
    object: c.data_incident
    negated: true
    evidence: [{quote: "A failed job that is rerun successfully before any deadline is not."}]
  - id: s.DO.11
    predicate: Definition
    subject: c.business_day
    text: "Monday to Friday, excluding company holidays in the company calendar"
    evidence: [{quote: "A business day is Monday to Friday, excluding company holidays in the company calendar."}]
  - id: s.DO.12
    predicate: ComputedAs
    subject: c.freshness
    expression: "the time between the last successful load of a data product and now"
    inputs: [c.last_successful_load, c.now]
    evidence: [{quote: "Freshness is the time between the last successful load of a data product and now."}]
  - id: s.DO.13
    predicate: ComputedAs
    subject: c.completeness
    metric_type: ratio
    expression: "rows_arrived / expected_rows"
    numerator: c.rows_arrived
    denominator: c.expected_rows
    evidence: [{quote: "Completeness is the share of expected rows that arrived"}]
  - id: s.DO.14
    predicate: ComputedAs
    subject: c.expected_rows
    expression: "the 7-day average of rows that arrived, for the same weekday"
    inputs: [c.rows_arrived]
    evidence: [{quote: "measured against the 7-day average for the same weekday."}]
  - id: s.DO.15
    predicate: ComputedAs
    subject: c.net_revenue
    metric_type: derived
    expression: "gross_order_value - discounts - refunds - taxes"
    inputs: [c.gross_order_value, c.discounts, c.refunds, c.taxes]
    filters:
      - {description: "orders with status completed", field: c.order_status, comparator: equal, values: [{value: completed}]}
    evidence: [{quote: "Net revenue is gross order value minus discounts, refunds and taxes, for orders with status completed."}]
  - id: s.DO.16
    predicate: HasProperty
    subject: c.net_revenue
    standard_attribute: unit
    property_value: {value: USD}
    evidence: [{quote: "It is reported in USD."}]

  # 2. Pipelines and schedules
  - id: s.DO.17
    predicate: Triggers
    subject: t.orders_pipeline
    action: {verb: load, objects: [t.table.fct_orders]}
    recurrence: "every day at 02:00 UTC"
    evidence: [{quote: "The orders pipeline loads fct_orders every day at 02:00 UTC."}]
  - id: s.DO.18
    predicate: Triggers
    subject: t.customers_pipeline
    action: {verb: load, objects: [t.table.dim_customers]}
    recurrence: "every day at 03:00 UTC"
    when:
      - {description: "the orders pipeline has finished", about: [c.orders_pipeline_finished]}
    evidence: [{quote: "The customers pipeline loads dim_customers every day at 03:00 UTC, after the orders pipeline has finished."}]
  - id: s.DO.95
    predicate: BelongsTo
    subject: c.orders_pipeline_finished
    object: t.orders_pipeline
    evidence: [{quote: "the orders pipeline has finished"}]
  - id: s.DO.19
    predicate: Triggers
    subject: t.finance_pipeline
    action: {verb: load, specific_verb: build, objects: [t.table.fct_orders], to: [t.table.fct_monthly_revenue]}
    recurrence: "on the first business day of each month at 06:00 UTC"
    evidence: [{quote: "The finance pipeline runs on the first business day of each month at 06:00 UTC and builds fct_monthly_revenue from fct_orders."}]
  - id: s.DO.20
    predicate: DerivedFrom
    subject: t.table.fct_monthly_revenue
    object: t.table.fct_orders
    evidence: [{quote: "builds fct_monthly_revenue from fct_orders."}]
  - id: s.DO.21
    predicate: Triggers
    subject: c.pipeline
    each: true
    action: {verb: load, specific_verb: write, objects: [t.table.load_audit]}
    recurrence: "per run"
    evidence: [{quote: "Every pipeline writes one row per run to load_audit"}]
  - id: s.DO.22
    predicate: HasGrain
    subject: t.table.load_audit
    text: "one row per run"
    members: [c.pipeline_run]
    evidence: [{quote: "one row per run to load_audit"}]
  - {id: s.DO.23, predicate: Contains, subject: t.table.load_audit, object: t.table.load_audit.status, data_role: dimension, evidence: [{quote: "with the run's status, row count and finish time."}]}
  - {id: s.DO.24, predicate: Contains, subject: t.table.load_audit, object: t.table.load_audit.row_count, data_role: measure, evidence: [{quote: "with the run's status, row count and finish time."}]}
  - {id: s.DO.25, predicate: Contains, subject: t.table.load_audit, object: t.table.load_audit.finish_time, data_role: time_dimension, evidence: [{quote: "with the run's status, row count and finish time."}]}

  # 3. Readiness and freshness
