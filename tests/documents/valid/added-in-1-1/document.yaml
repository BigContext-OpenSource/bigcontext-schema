statements:
- id: s.1
  predicate: Habit
  subject: c.shopper
  quantifier: most
  action:
    verb: ask
    objects:
    - c.delivery_date
  evidence:
  - quote: Most shoppers ask about delivery dates
- id: s.2
  predicate: Habit
  subject: c.shopper
  quantifier: few
  action:
    verb: ask
    objects:
    - c.returns_window
  evidence:
  - quote: few ask about the returns window
- id: s.3
  predicate: Overlaps
  subject: c.buyer
  object: c.recipient
  frequency: often
  evidence:
  - quote: The buyer is often also the recipient.
- id: s.4
  predicate: CorrelatesWith
  subject: c.basket_size
  object: c.product_views
  direction: increases
  evidence:
  - quote: Basket size tends to rise with product views, though neither causes the other.
- id: s.5
  predicate: ComputedAs
  subject: c.sale_source
  aggregation: first
  expression: the first ad the shopper clicked
  inputs:
  - c.ad_click
  evidence:
  - quote: A sale's source is the first ad the shopper clicked.
- id: s.6
  predicate: Has
  subject: c.order
  object: c.invoice
  cardinality: one_to_one
  evidence:
  - quote: Orders and invoices match one to one
- id: s.7
  predicate: Has
  subject: c.split_order
  object: c.parcel
  cardinality: more_than_one
  evidence:
  - quote: a split order has more than one parcel
- id: s.8
  predicate: JoinsTo
  subject: t.shop.products
  object: t.shop.suppliers
  cardinality: many_to_many
  evidence:
  - quote: Products join to suppliers many to many.
- id: s.9
  predicate: JoinsTo
  subject: t.shop.orders
  object: t.shop.invoices
  evidence:
  - quote: The join from orders to invoices
- id: s.10
  predicate: HasStatus
  subject: s.9
  status: certified
  evidence:
  - quote: The join from orders to invoices is certified.
- id: s.11
  predicate: IsA
  subject: c.wholesale_buyer
  object: c.customer
  evidence:
  - quote: Some customers are wholesale buyers.
- id: s.12
  predicate: ComputedAs
  subject: c.customer_region
  aggregation: last
  expression: the last region on their address history
  evidence:
  - quote: A customer's region is the last region on their address history.
- id: s.13
  predicate: Habit
  subject: c.wholesale_buyer
  frequency: usually
  action:
    verb: other
    specific_verb: order
    via:
    - c.phone
  evidence:
  - quote: Wholesale buyers usually order by phone.
- id: s.14
  predicate: Habit
  frequency: often
  action:
    verb: analyze
    specific_verb: look at
    objects:
    - c.sales
    by:
    - c.region
    - c.device
  evidence:
  - quote: Sales are often looked at by region and by device.
- id: s.15
  predicate: Groups
  subject: c.return
  members:
  - c.damaged_return
  - c.unwanted_return
  divided_by:
  - c.return_reason
  frequency: sometimes
  evidence:
  - quote: Returns are sometimes divided by reason into damaged and unwanted.
- id: s.16
  predicate: SynonymOf
  term: guests
  subject: c.shopper
  usage: sometimes
  especially_when:
  - description: they have no account
  evidence:
  - quote: Shoppers are sometimes called guests, especially when they have no account.
- id: s.17
  predicate: Caveat
  subject: t.shop.orders
  text: order data is missing
  period:
    start: '2026-06-01'
    end: '2026-06-03'
  evidence:
  - quote: Order data is missing from 1 to 3 June 2026.
- id: s.18
  predicate: HasProperty
  subject: c.sales
  attribute: c.total_amount
  property_value:
    value: '1200000'
    datatype: number
    unit: USD
  period:
    named: c.q1_2026
  recorded_on: '2026-05-10'
  evidence:
  - quote: Q1 sales were restated on 10 May 2026 to $1.2 million.
- id: s.19
  predicate: ComputedAs
  subject: c.orders_7d
  metric_type: cumulative
  expression: orders over the last 7 days
  inputs:
  - c.order_count
  values:
  - value: '7'
    datatype: duration
    unit: days
    value_role: window
  reporting_grain: day
  evidence:
  - quote: Orders over the last 7 days are counted every day.
- id: s.20
  predicate: ComputedAs
  subject: c.sales_ytd
  metric_type: cumulative
  expression: sales from the start of the fiscal year
  inputs:
  - c.sales
  grain_to_date: year
  calendar: c.fiscal_calendar
  evidence:
  - quote: Sales year to date add up from the start of the fiscal year, on the fiscal calendar.
- id: s.21
  predicate: ComputedAs
  subject: c.sales_last_year
  metric_type: derived
  expression: sales
  inputs:
  - c.sales
  values:
  - value: '1'
    datatype: duration
    unit: year
    value_role: offset
  evidence:
  - quote: Sales the same week last year
- id: s.22
  predicate: ComputedAs
  subject: c.sales_vs_last_year
  metric_type: derived
  expression: sales / sales_last_year - 1
  inputs:
  - c.sales
  - c.sales_last_year
  evidence:
  - quote: Sales the same week last year are compared with this week's sales.
- id: s.23
  predicate: ComputedAs
  subject: c.cart_conversion
  metric_type: conversion
  expression: carts that become orders / carts
  numerator: c.carts_ordered
  denominator: c.carts_started
  entity: c.cart
  values:
  - value: '2'
    datatype: duration
    unit: days
    value_role: window
  evidence:
  - quote: Cart conversion is the share of carts that become orders within 2 days.
- id: s.24
  predicate: ComputedAs
  subject: c.stock
  aggregation: sum
  expression: stock count
  non_additive:
    across:
    - c.day
    take: last
    per:
    - c.warehouse
  evidence:
  - quote: Stock is the last count of each day for each warehouse, and is never summed across days.
- id: s.25
  predicate: ComputedAs
  subject: c.daily_sales
  metric_type: simple
  expression: sales
  inputs:
  - c.sales
  reporting_grain: day
  values:
  - value: '0'
    datatype: number
    value_role: default
  evidence:
  - quote: Days with no sales show 0.
- id: s.26
  predicate: HasAccess
  subject: t.store_managers
  object: t.shop.orders
  access: read
  filters:
  - description: their own store
    field: t.shop.orders.store_id
    comparator: equal
    compare_to: c.viewer_store
  evidence:
  - quote: Store managers see only the orders of their own store.
- id: s.27
  predicate: ImplementedBy
  subject: c.viewer_store
  object: t.hr.staff.store_id
  evidence:
  - quote: A viewer's store is the store_id on their staff record.
- id: s.28
  predicate: Rule
  modality: must_not
  action:
    verb: approve
    objects:
    - c.refund
  when:
  - description: the refund was requested by whoever is approving
    field: t.shop.refunds.requested_by
    comparator: equal
    compare_to: c.acting_person
  evidence:
  - quote: Whoever requests a refund may not approve it.
- id: s.29
  predicate: Rule
  modality: must_not
  action:
    verb: other
    specific_verb: refund
    objects:
    - c.refund
    to:
    - c.customer
    values:
    - value: '3'
      datatype: number
      unit: refunds
      value_role: threshold
      comparator: more_than
      per:
      - c.customer
      - c.calendar_month
  evidence:
  - quote: No customer gets more than 3 refunds per calendar month.
- id: s.30
  predicate: Rule
  modality: must_not
  action:
    verb: other
    specific_verb: refund
    objects:
    - c.refund
  when:
  - description: the refund is over $500
    values:
    - value: '500'
      datatype: number
      unit: USD
      value_role: threshold
      comparator: more_than
  unless:
  - description: two different managers approve it
    about:
    - t.manager
    values:
    - value: '2'
      datatype: number
      unit: approvals
      value_role: threshold
      comparator: at_least
      distinct: true
  evidence:
  - quote: A refund over $500 needs approval from two different managers.
- id: s.31
  predicate: ResponsibleFor
  subject: t.finance
  responsibility: consulted
  object: t.sales_dashboard
  evidence:
  - quote: Finance is consulted
- id: s.32
  predicate: ResponsibleFor
  subject: t.store_managers
  responsibility: kept_informed
  object: t.sales_dashboard
  evidence:
  - quote: the store managers are kept informed
- id: s.33
  predicate: JoinsTo
  subject: t.shop.customers
  object: t.shop.orders
  join_type: anti
  evidence:
  - quote: To find customers with no order, keep the customers that have no match in orders.
- id: s.34
  predicate: JoinsTo
  subject: t.shop.orders
  object: t.shop.customers
  role: c.buyer
  evidence:
  - quote: once as the buyer
- id: s.35
  predicate: JoinsTo
  subject: t.shop.orders
  object: t.shop.customers
  role: c.recipient
  evidence:
  - quote: once as the recipient
- id: s.36
  predicate: IdentifiedBy
  subject: t.shop.customers
  members:
  - t.shop.customers.customer_id
  primary: true
  evidence:
  - quote: Customers are identified by customer_id
- id: s.37
  predicate: IdentifiedBy
  subject: t.shop.customers
  members:
  - t.shop.customers.email
  primary: false
  stable: false
  evidence:
  - quote: and also by email, which can change
- id: s.38
  predicate: RecordMatch
  subject: t.shop.customers
  object: t.mail.contacts
  key_pairs:
  - from_field: t.shop.customers.email
    to_field: t.mail.contacts.email
    normalize:
    - trim
    - ignore_case
  evidence:
  - quote: A shop customer and a newsletter contact count as one customer when their trimmed, lowercased emails match.
- id: s.39
  predicate: RuleSet
  subject: c.privacy_rules
  overrides:
  - s.40
  evidence:
  - quote: Privacy rules override the store guidelines.
- id: s.40
  predicate: RuleSet
  subject: c.store_guidelines
  evidence:
  - quote: the store guidelines
- id: s.41
  predicate: JoinsTo
  subject: t.shop.orders
  object: t.shop.payments
  cardinality: one_to_many
  expected_cardinality: one_to_one
  evidence:
  - quote: Orders should match payments one to one, but split payments make duplicates.
- id: s.42
  predicate: Rule
  modality: must_not
  action:
    verb: update
    objects:
    - c.metric_definition
  unless:
  - description: whoever changes it owns it
    party_responsibility: owns
  evidence:
  - quote: Only a metric's owner may change its definition.
- id: s.43
  predicate: ComputedAs
  subject: c.delivery_time
  aggregation: percentile_discrete
  expression: hours to deliver
  values:
  - value: '0.95'
    datatype: number
    value_role: percentile
  evidence:
  - quote: Delivery time is the 95th percentile of hours to deliver, always one of the actual times.
- id: s.44
  predicate: JoinsTo
  subject: t.mail.contacts
  object: t.shop.customers
  key_pairs:
  - from_field: t.mail.contacts.customer_number
    to_field: t.shop.customers.customer_id
    normalize:
    - cast_to_number
  evidence:
  - quote: The newsletter keeps customer numbers as text; compare them with the shop's customer_id as numbers.
- id: s.45
  predicate: JoinsTo
  subject: t.wh.deliveries
  object: t.shop.orders
  key_pairs:
  - from_field: t.wh.deliveries.postcode
    to_field: t.shop.orders.postcode
    normalize:
    - cast_to_text
  evidence:
  - quote: Warehouse postcodes are compared with order postcodes as text.
- id: s.46
  predicate: Contains
  subject: t.sales.order_items
  object: t.sales.order_items.order_date
  data_role: time_dimension
  evidence:
  - quote: '"Order Date"'
- id: s.47
  predicate: Contains
  subject: t.sales.order_items
  object: t.sales.order_items.orderId
  data_role: attribute
  evidence:
  - quote: '"orderId"'
- id: s.48
  predicate: Contains
  subject: t.sales.order_items
  object: t.sales.order_items.OrderID
  data_role: attribute
  evidence:
  - quote: The "Order Items" table in the "Sales" schema has the columns "Order Date", "orderId" and "OrderID".
- id: s.49
  predicate: Habit
  subject: c.shopper
  quantifier: some
  action:
    verb: other
    specific_verb: pay
    via:
    - c.invoice
  evidence:
  - quote: Some shoppers pay by invoice.
