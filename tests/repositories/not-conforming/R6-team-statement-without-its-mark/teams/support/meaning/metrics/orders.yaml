schema_version: 1.3.0
source:
  id: acme-store
external:
- c.orders
- t.shop.orders
- t.shop.orders.order_date
- t.shop.orders.status
statements:
- id: s.support.orders.computed_as.shop.orders
  predicate: ComputedAs
  subject: c.orders
  metric_type: simple
  aggregation: count
  expression: '*'
  base: t.shop.orders
  time_dimension: t.shop.orders.order_date
  filters:
  - field: t.shop.orders.status
    comparator: equal
    values:
    - value: Shipped
    description: STATUS is Shipped
  evidence:
  - quote: For Support, Orders is the number of orders placed in a period whose STATUS is Shipped.
